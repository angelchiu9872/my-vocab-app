<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Power English - 您的專屬英語學習平台</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary-pink: #FFD9E6;
            --primary-pink-dark: #fbacc9;
        }
        body { -webkit-tap-highlight-color: transparent; background-color: #fff9fb; }
        .bg-primary { background-color: var(--primary-pink); }
        .text-primary { color: #d46a8f; }
        
        .expand-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-in-out, opacity 0.3s;
            opacity: 0;
        }
        .expanded .expand-content {
            max-height: 2000px;
            opacity: 1;
        }

        @keyframes pulse-red {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        .animate-pulse-red { animation: pulse-red 1.5s infinite; }
        
        .dot-flashing {
            position: relative;
            width: 10px; height: 10px;
            border-radius: 5px;
            background-color: #d46a8f;
            animation: dot-flashing 1s infinite linear alternate;
            animation-delay: .5s;
        }
        .dot-flashing::before, .dot-flashing::after {
            content: ''; display: inline-block; position: absolute; top: 0;
            width: 10px; height: 10px; border-radius: 5px; background-color: #d46a8f;
            animation: dot-flashing 1s infinite linear alternate;
        }
        .dot-flashing::before { left: -15px; animation-delay: 0s; }
        .dot-flashing::after { left: 15px; animation-delay: 1s; }
        @keyframes dot-flashing {
            0% { background-color: #d46a8f; }
            50%, 100% { background-color: #ffd9e6; }
        }
    </style>
</head>
<body class="font-sans text-slate-800 pb-24">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyB5DBCI5GVeE6AR-krsXly8CsGpEq0Zucw",
            authDomain: "my-vocab-app-6935a.firebaseapp.com",
            projectId: "my-vocab-app-6935a",
            storageBucket: "my-vocab-app-6935a.firebasestorage.app",
            messagingSenderId: "200389430232",
            appId: "1:200389430232:web:d54657804db03fa7ca80ad"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = "my-vocab-app-6935a";

        // 修復後的 Gemini API 呼叫邏輯
        const callGemini = async (prompt, systemPrompt = "") => {
            // 確保抓取環境注入的 apiKey
            const api_key = typeof apiKey !== 'undefined' ? apiKey : "";
            const model = "gemini-2.5-flash-preview-09-2025";
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${api_key}`;
            
            let retries = 0;
            const maxRetries = 5;
            
            while (retries < maxRetries) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            systemInstruction: systemPrompt ? { parts: [{ text: systemPrompt }] } : undefined
                        })
                    });
                    
                    if (!response.ok) {
                        const errData = await response.json();
                        throw new Error(errData.error?.message || "API Error");
                    }
                    
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "AI 忙碌中，請稍後再試。";
                } catch (error) {
                    console.error("Gemini Error:", error);
                    retries++;
                    if (retries === maxRetries) return `連線失敗: ${error.message}`;
                    // 指數退避
                    await new Promise(r => setTimeout(r, Math.pow(2, retries) * 1000));
                }
            }
        };

        const Icons = {
            Search: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>,
            Mic: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>,
            Folder: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>,
            Youtube: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.42a2.78 2.78 0 0 0-1.94 2C1 8.14 1 12 1 12s0 3.86.46 5.58a2.78 2.78 0 0 0 1.94 2C5.12 20 12 20 12 20s6.88 0 8.6-.42a2.78 2.78 0 0 0 1.94-2C23 15.86 23 12 23 12s0-3.86-.46-5.58z"></path><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02"></polygon></svg>,
            Plus: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            X: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            Volume: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>,
            Trash: ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Clock: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>,
            Brain: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-2.54z"></path><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-2.54z"></path></svg>
        };

        function App() {
            const [activeTab, setActiveTab] = useState('vocab');
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(false);
            
            // 單字狀態
            const [words, setWords] = useState([]);
            const [vocabSearch, setVocabSearch] = useState('');
            const [expandedIds, setExpandedIds] = useState(new Set());
            const [quizMode, setQuizMode] = useState(false);
            const [currentQuizIndex, setCurrentQuizIndex] = useState(0);
            const [showQuizAnswer, setShowQuizAnswer] = useState(false);

            // 口說狀態
            const [speakingStep, setSpeakingStep] = useState('idle'); 
            const [speakingRecords, setSpeakingRecords] = useState([]);
            const [currentExam, setCurrentExam] = useState("");
            const [transcript, setTranscript] = useState("");
            const [isRecording, setIsRecording] = useState(false);
            const [timeLeft, setTimeLeft] = useState(120);
            const [aiFeedback, setAiFeedback] = useState("");
            const recognitionRef = useRef(null);
            const timerRef = useRef(null);

            // 筆記狀態
            const [folders, setFolders] = useState([]);
            const [currentFolder, setCurrentFolder] = useState(null);
            const [isAddingFolder, setIsAddingFolder] = useState(false);
            const [isAddingNote, setIsAddingNote] = useState(false);

            const [videoRecommendations, setVideoRecommendations] = useState("");

            useEffect(() => {
                auth.signInAnonymously();
                const unsubAuth = auth.onAuthStateChanged(u => setUser(u));
                
                const unsubWords = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('my-room')
                    .orderBy('createdAt', 'desc').onSnapshot(snap => {
                        setWords(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });

                const unsubSpeak = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('speaking-records')
                    .orderBy('createdAt', 'desc').onSnapshot(snap => {
                        setSpeakingRecords(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });

                const unsubFolders = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('notes-folders')
                    .onSnapshot(snap => {
                        setFolders(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });

                return () => { unsubAuth(); unsubWords(); unsubSpeak(); unsubFolders(); };
            }, []);

            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    recognitionRef.current = new SpeechRecognition();
                    recognitionRef.current.continuous = true;
                    recognitionRef.current.interimResults = true;
                    recognitionRef.current.lang = 'en-US';
                    recognitionRef.current.onresult = (event) => {
                        let final = "";
                        for (let i = 0; i < event.results.length; i++) {
                            final += event.results[i][0].transcript;
                        }
                        setTranscript(final);
                    };
                }
            }, []);

            // --- 單字功能 ---
            const playPronunciation = (word) => {
                const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(word)}&tl=en&client=tw-ob`;
                const audio = new Audio(url);
                audio.play();
            };

            const deleteWord = async (id, e) => {
                e.stopPropagation();
                if (confirm("確定要刪除這個單字嗎？")) {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('my-room').doc(id).delete();
                }
            };

            const startQuiz = () => {
                if (words.length === 0) return;
                setQuizMode(true);
                setCurrentQuizIndex(0);
                setShowQuizAnswer(false);
            };

            const nextQuiz = () => {
                if (currentQuizIndex < words.length - 1) {
                    setCurrentQuizIndex(currentQuizIndex + 1);
                    setShowQuizAnswer(false);
                } else {
                    setQuizMode(false);
                }
            };

            // --- 口說功能 ---
            const startExam = async () => {
                setLoading(true);
                setSpeakingStep('practicing');
                setTranscript("");
                setAiFeedback("");
                setCurrentExam("");
                
                const systemPrompt = "You are an IELTS Speaking Examiner. Provide high-quality, realistic Speaking Part 2 prompts.";
                const prompt = "Please generate a unique and challenging IELTS Speaking Part 2 prompt (Cue Card). Include the main topic statement and exactly 4 specific bullet points (starting with 'You should say...'). Format it clearly with bullet points and bold headers for a mobile app screen. Do not include extra conversational text.";
                
                try {
                    const exam = await callGemini(prompt, systemPrompt);
                    setCurrentExam(exam);
                    updateVideoRecs(exam);
                } catch (e) {
                    setCurrentExam("發生錯誤：" + e.message);
                } finally {
                    setLoading(false);
                }
            };

            const toggleRecording = () => {
                if (!isRecording) {
                    try {
                        recognitionRef.current?.start();
                        setIsRecording(true);
                        setTimeLeft(120);
                        if (timerRef.current) clearInterval(timerRef.current);
                        timerRef.current = setInterval(() => {
                            setTimeLeft(prev => {
                                if (prev <= 1) {
                                    clearInterval(timerRef.current);
                                    return 0;
                                }
                                return prev - 1;
                            });
                        }, 1000);
                    } catch (e) {
                        console.error("Speech Recognition Error:", e);
                    }
                } else {
                    recognitionRef.current?.stop();
                    setIsRecording(false);
                    if (timerRef.current) clearInterval(timerRef.current);
                }
            };

            const submitExam = async () => {
                if (timerRef.current) clearInterval(timerRef.current);
                setLoading(true);
                setSpeakingStep('reviewing');
                const systemPrompt = "You are an expert IELTS Tutor. Provide detailed feedback in Traditional Chinese.";
                const prompt = `Review my IELTS Part 2 answer.\n\nQuestion:\n${currentExam}\n\nMy Answer Transcript:\n${transcript}\n\nPlease provide:\n1. Estimated Band Score.\n2. Key Strengths and Weaknesses.\n3. Detailed Feedback on Vocabulary and Grammar.\n4. Three improved native-level sentences for my answer.`;
                
                try {
                    const feedback = await callGemini(prompt, systemPrompt);
                    setAiFeedback(feedback);
                    
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('speaking-records').add({
                        question: currentExam,
                        answer: transcript,
                        feedback: feedback,
                        createdAt: Date.now()
                    });
                } catch (e) {
                    setAiFeedback("批改失敗：" + e.message);
                } finally {
                    setLoading(false);
                }
            };

            const updateVideoRecs = async (topic) => {
                const prompt = `Based on this IELTS topic: "${topic}", provide 3 specific keywords for someone to search on YouTube to find model answers or related vocabulary. Just list the 3 keywords.`;
                try {
                    const recs = await callGemini(prompt);
                    setVideoRecommendations(recs);
                } catch (e) {
                    setVideoRecommendations("無法載入推薦影片。");
                }
            };

            // --- 筆記管理 ---
            const addFolder = async (name) => {
                if (!name) return;
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('notes-folders').add({
                    name, notes: [], createdAt: Date.now()
                });
                setIsAddingFolder(false);
            };

            const addNoteToFolder = async (folderId, title, content) => {
                const folder = folders.find(f => f.id === folderId);
                const newNote = { id: Date.now().toString(), title, content, createdAt: Date.now() };
                const newNotes = [newNote, ...(folder.notes || [])];
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('notes-folders').doc(folderId).update({
                    notes: newNotes
                });
                setIsAddingNote(false);
            };

            const formatContent = (content) => {
                let html = content.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
                html = html.replace(/\[r\](.*?)\[\/r\]/g, '<span class="text-red-500 font-bold">$1</span>');
                return html;
            };

            const filteredWords = useMemo(() => {
                return words.filter(w => w.word.toLowerCase().includes(vocabSearch.toLowerCase()) || w.meaning.includes(vocabSearch));
            }, [words, vocabSearch]);

            const Nav = () => (
                <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 flex justify-around items-center h-20 px-4 z-50 shadow-lg">
                    {[
                        { id: 'vocab', label: '單字', icon: <Icons.Volume size={22} /> },
                        { id: 'speak', label: '口說', icon: <Icons.Mic size={22} /> },
                        { id: 'note', label: '筆記', icon: <Icons.Folder size={22} /> },
                        { id: 'video', label: '影片', icon: <Icons.Youtube size={22} /> }
                    ].map(tab => (
                        <button 
                            key={tab.id} 
                            onClick={() => { setActiveTab(tab.id); setQuizMode(false); }}
                            className={`flex flex-col items-center gap-1 transition-colors ${activeTab === tab.id ? 'text-[#d46a8f]' : 'text-slate-400'}`}
                        >
                            {tab.icon}
                            <span className="text-[10px] font-bold">{tab.label}</span>
                        </button>
                    ))}
                </div>
            );

            return (
                <div className="min-h-screen">
                    <header className="bg-primary/30 backdrop-blur p-6 sticky top-0 z-40 border-b border-[#FFD9E6] flex justify-between items-center">
                        <h1 className="text-2xl font-black text-[#d46a8f] tracking-tighter italic">Power English</h1>
                        {activeTab === 'vocab' && !quizMode && (
                            <button onClick={startQuiz} className="p-2 bg-white text-[#d46a8f] rounded-full shadow-sm"><Icons.Brain /></button>
                        )}
                    </header>

                    <div className="max-w-xl mx-auto p-4 animate-in fade-in duration-500">
                        {/* 1. 單字頁 */}
                        {activeTab === 'vocab' && (
                            quizMode ? (
                                <div className="space-y-6">
                                    <div className="flex justify-between items-center text-xs font-bold text-slate-400">
                                        <span>單字測驗中...</span>
                                        <span>{currentQuizIndex + 1} / {words.length}</span>
                                    </div>
                                    <div className="bg-white p-12 rounded-[3rem] shadow-xl border-2 border-[#FFD9E6] text-center space-y-8">
                                        <h2 className="text-4xl font-black text-slate-800">{words[currentQuizIndex].word}</h2>
                                        {showQuizAnswer ? (
                                            <div className="animate-in zoom-in duration-300">
                                                <p className="text-2xl font-bold text-[#d46a8f] mb-2">{words[currentQuizIndex].meaning}</p>
                                                {words[currentQuizIndex].example && <p className="text-sm text-slate-500 italic mt-2">{words[currentQuizIndex].example}</p>}
                                            </div>
                                        ) : (
                                            <button onClick={() => setShowQuizAnswer(true)} className="px-8 py-3 bg-[#FFD9E6] text-[#d46a8f] rounded-full font-bold">顯示答案</button>
                                        )}
                                    </div>
                                    <div className="flex gap-4">
                                        <button onClick={() => setQuizMode(false)} className="flex-1 py-4 bg-slate-100 text-slate-500 rounded-2xl font-bold">結束</button>
                                        {showQuizAnswer && (
                                            <button onClick={nextQuiz} className="flex-2 py-4 px-10 bg-[#d46a8f] text-white rounded-2xl font-bold shadow-lg">下一題</button>
                                        )}
                                    </div>
                                </div>
                            ) : (
                                <section className="space-y-4">
                                    <div className="relative">
                                        <div className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icons.Search /></div>
                                        <input 
                                            type="text" placeholder="搜尋目前單字紀錄..."
                                            className="w-full pl-12 pr-4 py-4 bg-white rounded-2xl border-none shadow-sm outline-none focus:ring-2 focus:ring-[#FFD9E6]"
                                            value={vocabSearch} onChange={e => setVocabSearch(e.target.value)}
                                        />
                                    </div>
                                    {filteredWords.map(w => (
                                        <div key={w.id} onClick={() => {const s=new Set(expandedIds); if(s.has(w.id)) s.delete(w.id); else s.add(w.id); setExpandedIds(s);}}
                                            className={`relative bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 transition-all ${expandedIds.has(w.id) ? 'ring-2 ring-[#FFD9E6] expanded' : ''}`}
                                        >
                                            <button onClick={(e) => deleteWord(w.id, e)} className="absolute top-4 right-4 text-slate-300 hover:text-red-400 transition-colors p-2"><Icons.Trash size={18} /></button>
                                            <div className="flex items-center gap-3">
                                                <h3 className="text-xl font-black text-slate-800">{w.word}</h3>
                                                <button onClick={(e) => { e.stopPropagation(); playPronunciation(w.word); }} className="text-[#d46a8f] hover:scale-110 transition-transform"><Icons.Volume size={18} /></button>
                                            </div>
                                            <div className="expand-content">
                                                <p className="mt-4 text-[#d46a8f] font-bold text-lg border-t border-slate-50 pt-4">{w.meaning}</p>
                                                {w.example && <p className="mt-2 text-slate-500 italic text-sm bg-slate-50 p-3 rounded-xl">Example: {w.example}</p>}
                                                {w.note && <p className="mt-2 text-slate-400 text-xs px-1">Note: {w.note}</p>}
                                            </div>
                                        </div>
                                    ))}
                                    {filteredWords.length === 0 && <div className="text-center py-20 text-slate-300 text-sm">尚未有任何單字。</div>}
                                </section>
                            )
                        )}

                        {/* 2. 口說練習 */}
                        {activeTab === 'speak' && (
                            <section className="space-y-6">
                                <div className="flex gap-2 p-1 bg-white rounded-2xl shadow-sm border border-slate-100">
                                    <button onClick={() => setSpeakingStep('idle')} className={`flex-1 py-2 rounded-xl text-xs font-bold ${speakingStep !== 'records' ? 'bg-[#FFD9E6] text-[#d46a8f]' : 'text-slate-400'}`}>練習區</button>
                                    <button onClick={() => setSpeakingStep('records')} className={`flex-1 py-2 rounded-xl text-xs font-bold ${speakingStep === 'records' ? 'bg-[#FFD9E6] text-[#d46a8f]' : 'text-slate-400'}`}>紀錄區</button>
                                </div>

                                {speakingStep === 'records' ? (
                                    <div className="space-y-4">
                                        {speakingRecords.map(r => (
                                            <div key={r.id} className="bg-white p-5 rounded-[2rem] shadow-sm border border-slate-100">
                                                <p className="text-[10px] font-black text-slate-400 mb-2">{new Date(r.createdAt).toLocaleString()}</p>
                                                <p className="font-bold text-slate-700 line-clamp-2 mb-3">{r.question}</p>
                                                <div className="bg-slate-50 p-3 rounded-xl text-sm italic text-slate-500 mb-2">"{r.answer}"</div>
                                                <div className="text-xs text-[#d46a8f] whitespace-pre-wrap">{r.feedback}</div>
                                            </div>
                                        ))}
                                        {speakingRecords.length === 0 && <div className="text-center py-20 text-slate-300 text-sm">無錄音紀錄。</div>}
                                    </div>
                                ) : (
                                    <div className="space-y-6">
                                        {speakingStep === 'idle' && (
                                            <div className="bg-white p-10 rounded-[3rem] text-center space-y-4 shadow-sm">
                                                <div className="w-20 h-20 bg-[#FFD9E6] rounded-full flex items-center justify-center mx-auto text-[#d46a8f]"><Icons.Mic size={40} /></div>
                                                <h2 className="text-2xl font-black">雅思口說模擬</h2>
                                                <p className="text-slate-400 text-sm px-6">由 AI 自動出題，並提供精確轉譯與批改建議。</p>
                                                <button onClick={startExam} disabled={loading} className="w-full py-4 bg-[#FFD9E6] text-[#d46a8f] rounded-2xl font-black shadow-lg">
                                                    {loading ? "AI 思考中..." : "生成雅思考題"}
                                                </button>
                                            </div>
                                        )}

                                        {speakingStep === 'practicing' && (
                                            <div className="space-y-4">
                                                <div className="bg-white p-6 rounded-[2rem] shadow-sm border-2 border-[#FFD9E6] min-h-[180px] flex flex-col justify-center">
                                                    <h3 className="text-xs font-black text-[#d46a8f] uppercase mb-4 flex items-center gap-2"><Icons.Clock size={14} /> Exam Card</h3>
                                                    {loading ? (
                                                        <div className="flex justify-center items-center h-20"><div className="dot-flashing"></div></div>
                                                    ) : (
                                                        <div className="whitespace-pre-wrap text-slate-700 leading-relaxed font-bold animate-in fade-in">{currentExam}</div>
                                                    )}
                                                </div>

                                                <div className="bg-[#1e293b] p-6 rounded-[2rem] text-white space-y-4 shadow-xl">
                                                    <div className="flex justify-between items-center">
                                                        <div className="flex items-center gap-2">
                                                            <div className={`w-3 h-3 rounded-full ${isRecording ? 'bg-red-500 animate-pulse' : 'bg-slate-600'}`}></div>
                                                            <span className="text-xs font-bold">
                                                                {Math.floor(timeLeft / 60)}:{(timeLeft % 60).toString().padStart(2, '0')}
                                                            </span>
                                                        </div>
                                                        <span className="text-xs font-bold text-slate-400">即時轉譯</span>
                                                    </div>
                                                    <div className="min-h-[100px] text-lg font-medium italic text-slate-300 leading-snug">{transcript || "點擊按鈕開始錄製..."}</div>
                                                    <div className="flex justify-center">
                                                        <button onClick={toggleRecording} className={`p-8 rounded-full transition-all ${isRecording ? 'bg-red-500 animate-pulse-red shadow-[0_0_20px_rgba(239,68,68,0.4)]' : 'bg-[#FFD9E6] text-[#d46a8f]'}`}>
                                                            <Icons.Mic size={32} />
                                                        </button>
                                                    </div>
                                                </div>
                                                <button onClick={submitExam} disabled={loading || !transcript} className="w-full py-4 bg-[#d46a8f] text-white rounded-2xl font-black shadow-lg disabled:opacity-50">
                                                    {loading ? "批改分析中..." : "完成練習並批改"}
                                                </button>
                                            </div>
                                        )}

                                        {speakingStep === 'reviewing' && (
                                            <div className="space-y-4">
                                                <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
                                                    <h3 className="text-xl font-black text-[#d46a8f] mb-4">AI 批改報告</h3>
                                                    {loading ? (
                                                        <div className="flex flex-col items-center gap-4 py-10">
                                                            <div className="dot-flashing"></div>
                                                            <p className="text-xs text-slate-400">正在分析您的流暢度與文法...</p>
                                                        </div>
                                                    ) : (
                                                        <div className="whitespace-pre-wrap text-sm text-slate-600 leading-relaxed animate-in slide-in-from-top-4">{aiFeedback || "無分析資料。"}</div>
                                                    )}
                                                    {!loading && <button onClick={() => setSpeakingStep('idle')} className="mt-6 w-full py-3 bg-slate-100 text-slate-500 rounded-xl font-bold">返回練習區</button>}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </section>
                        )}

                        {/* 3. 重要筆記 */}
                        {activeTab === 'note' && (
                            <section className="space-y-4">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-black text-slate-800">
                                        {currentFolder ? (
                                            <button onClick={() => setCurrentFolder(null)} className="flex items-center gap-2 text-[#d46a8f]"><Icons.X size={20} /> {currentFolder.name}</button>
                                        ) : "筆記分類"}
                                    </h2>
                                    <button onClick={() => currentFolder ? setIsAddingNote(true) : setIsAddingFolder(true)} className="p-3 bg-[#FFD9E6] text-[#d46a8f] rounded-full shadow-sm"><Icons.Plus /></button>
                                </div>

                                {!currentFolder ? (
                                    <div className="grid grid-cols-2 gap-4">
                                        {folders.map(f => (
                                            <div key={f.id} onClick={() => setCurrentFolder(f)} className="relative group bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 text-center space-y-2 cursor-pointer transition-all hover:ring-2 hover:ring-[#FFD9E6]">
                                                <div className="text-[#d46a8f] mx-auto w-fit"><Icons.Folder size={40} /></div>
                                                <p className="font-bold text-slate-700 truncate px-2">{f.name}</p>
                                                <p className="text-[10px] text-slate-400">{(f.notes || []).length} 則內容</p>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        {(currentFolder.notes || []).map(note => (
                                            <div key={note.id} className="relative group bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
                                                <h4 className="font-black text-lg text-slate-800 mb-2 pr-8">{note.title}</h4>
                                                <div className="text-slate-600 text-sm leading-relaxed" dangerouslySetInnerHTML={{ __html: formatContent(note.content) }} />
                                            </div>
                                        ))}
                                        {(!currentFolder.notes || currentFolder.notes.length === 0) && <div className="text-center py-20 text-slate-300 text-sm">此資料夾尚無內容。</div>}
                                    </div>
                                )}
                            </section>
                        )}

                        {/* 4. 推薦影片 */}
                        {activeTab === 'video' && (
                            <section className="space-y-6">
                                <div className="bg-white p-8 rounded-[3rem] shadow-sm border border-slate-100">
                                    <div className="w-16 h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center mb-4"><Icons.Youtube size={32} /></div>
                                    <h2 className="text-xl font-black mb-2">AI 學習推薦</h2>
                                    <p className="text-slate-400 text-sm mb-6">根據您最近練習的題目，推薦 YouTube 搜尋關鍵字。</p>
                                    <div className="bg-slate-50 p-6 rounded-2xl text-slate-700 whitespace-pre-wrap text-sm italic min-h-[100px] flex items-center leading-relaxed">
                                        {videoRecommendations || "完成一場口說練習後將顯示推薦。"}
                                    </div>
                                    <a href="https://www.youtube.com/results?search_query=IELTS+Speaking+Practice" target="_blank" className="mt-6 block w-full py-4 bg-red-500 text-white rounded-2xl font-black text-center shadow-lg shadow-red-100">探索更多</a>
                                </div>
                            </section>
                        )}
                    </div>

                    <Nav />

                    {isAddingFolder && (
                        <Modal onClose={() => setIsAddingFolder(false)} title="新建資料夾">
                            <input id="new-folder-input" type="text" placeholder="資料夾名稱..." className="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-[#FFD9E6] mb-4" />
                            <button onClick={() => addFolder(document.getElementById('new-folder-input').value)} className="w-full py-4 bg-[#FFD9E6] text-[#d46a8f] rounded-2xl font-black">建立</button>
                        </Modal>
                    )}

                    {isAddingNote && (
                        <Modal onClose={() => setIsAddingNote(false)} title="新增筆記">
                            <div className="space-y-3">
                                <input id="note-title-input" type="text" placeholder="標題..." className="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-[#FFD9E6]" />
                                <textarea id="note-content-input" placeholder="內容..." className="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-[#FFD9E6] h-40"></textarea>
                                <button onClick={() => addNoteToFolder(currentFolder.id, document.getElementById('note-title-input').value, document.getElementById('note-content-input').value)} className="w-full py-4 bg-[#FFD9E6] text-[#d46a8f] rounded-2xl font-black">儲存</button>
                            </div>
                        </Modal>
                    )}
                </div>
            );
        }

        const Modal = ({ children, onClose, title }) => (
            <div className="fixed inset-0 z-[60] bg-slate-900/40 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
                <div className="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl animate-in slide-in-from-bottom-10">
                    <div className="flex justify-between items-center mb-6">
                        <h3 className="text-xl font-bold">{title}</h3>
                        <button onClick={onClose}><Icons.X className="text-slate-300" /></button>
                    </div>
                    {children}
                </div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
